[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soldeazy-mcp-server"
version = "0.1.0"
description = "Standalone MCP server for Soldeazy datasheet automation (price/stock change via export → modify → upload → sync)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp[cli]>=1.3.0,<2",
    "openpyxl>=3.1,<4",
    "playwright>=1.55,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
soldeazy-mcp-server = "soldeazy_mcp_server.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["soldeazy_mcp_server*"]

[tool.setuptools.package-data]
soldeazy_mcp_server = ["skills/*/*.md", "skills/*/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
